[project]
name = "itr-tax-erp"
version = "1.0.0"
description = "ITR Tax ERP - Python Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.10.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.17",
    "orjson>=3.10.0",
    "python-dotenv>=1.0.1",
    "openpyxl>=3.1.5",
    "pypdf>=5.1.0",
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.13",
    "pyzipper>=0.3.6",
    "pycryptodome>=3.20.0",
    "camelot-py>=0.12.0",
    "cryptography>=43.0.0",
    "reportlab>=4.2.5",
    "weasyprint>=62.3",
    "jinja2>=3.1.4",
    "apscheduler>=3.10.4",
    "redis>=5.2.0",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "RET", "SIM", "ARG"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing"
