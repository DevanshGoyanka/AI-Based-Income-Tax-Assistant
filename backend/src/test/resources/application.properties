spring.application.name=itr-filing-assistant-test

# H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA - auto-create tables for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable Flyway for tests
spring.flyway.enabled=false

# JWT — test values only; secret is a dummy for unit-test context
jwt.secret=test-secret-key-for-unit-tests-minimum-32-bytes-long
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# CORS — allow localhost for test context
app.cors.allowed-origins=http://localhost:3000

# File Upload
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
