spring.application.name=itr-filing-assistant

# Server Port - using 8082 to avoid conflicts
server.port=8082

# Application running check
spring.datasource.url=jdbc:postgresql://localhost:5432/itr_filing_db
spring.datasource.username=postgres
spring.datasource.password=Dsg@1234
spring.datasource.driver-class-name=org.postgresql.Driver
spring.h2.console.enabled=false

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=false

# JWT
jwt.secret=ThisIsASecretKeyForJWTTokenGeneration12345
jwt.expiration=86400000
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# File Upload
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Server
server.port=8080

# Logging
logging.level.com.itr.service.integration.AISImportService=DEBUG

# ITD ERI-2 API Configuration (configure after API keys received from ITD)
itd.api.base-url=https://eportal.incometax.gov.in/iec/foservices/
itd.api.key=
itd.api.secret=
itd.api.timeout-ms=30000
itd.api.max-retries=3

# ITD Portal Password Encryption (AES-256-GCM)
# Generate key: openssl rand -base64 32
# WARNING: Never commit this key to version control
itd.master.key=

# File Upload (expanded)
app.upload.dir=${user.home}/itr-filing-uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Tax Computation
tax.regime.default=NEW

# Playwright (for browser automation)
playwright.enabled=false
