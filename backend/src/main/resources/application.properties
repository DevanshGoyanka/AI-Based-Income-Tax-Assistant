spring.application.name=itr-filing-assistant

# Server Port
server.port=${SERVER_PORT:8080}

# Application running check
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/itr_filing_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.h2.console.enabled=false

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=false

# JWT — secret must be provided via environment variable; no hardcoded fallback
jwt.secret=${JWT_SECRET:}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# File Upload
app.upload.dir=${USER_HOME:${user.home}}/itr-filing-uploads
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:10MB}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Tax Computation
tax.regime.default=${TAX_REGIME_DEFAULT:NEW}

# Logging — production: INFO; set DEBUG via environment for import troubleshooting
logging.level.com.itr=INFO
logging.level.com.itr.service.integration.AISImportService=${LOG_LEVEL_AIS:INFO}
logging.level.com.itr.service.integration=${LOG_LEVEL_INTEGRATION:WARN}

# ITD ERI-2 API Configuration (configure after API keys received from ITD)
itd.api.base-url=${ITD_API_BASE_URL:https://eportal.incometax.gov.in/iec/foservices/}
itd.api.key=${ITD_API_KEY:}
itd.api.secret=${ITD_API_SECRET:}
itd.api.timeout-ms=${ITD_API_TIMEOUT_MS:30000}
itd.api.max-retries=${ITD_API_MAX_RETRIES:3}

# ITD Portal Password Encryption (AES-256-GCM)
# Generate key: openssl rand -base64 32
# WARNING: Never commit this key to version control
itd.master.key=${ITD_MASTER_KEY:}

# Playwright (for browser automation — out of scope per Doc 3 §0.1)
playwright.enabled=false
