spring.application.name=itr-filing-assistant

# Database - Local PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/itr_filing_db
spring.datasource.username=postgres
spring.datasource.password=Dsg@1234
spring.datasource.driver-class-name=org.postgresql.Driver
spring.h2.console.enabled=false

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=false

# JWT
jwt.secret=ThisIsASecretKeyForJWTTokenGeneration12345
jwt.expiration=86400000
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# File Upload
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Server
server.port=8080

# Logging
logging.level.com.itr.service.integration.AISImportService=DEBUG
