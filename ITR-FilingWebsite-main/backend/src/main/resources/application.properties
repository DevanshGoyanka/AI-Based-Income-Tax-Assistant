# Database - PostgreSQL (Production - Aiven Cloud)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:pg-13179506-devanshwarp-6830.j.aivencloud.com}:${POSTGRES_PORT:25555}/${POSTGRES_DB:defaultdb}?sslmode=require
spring.datasource.username=${POSTGRES_USER:avnadmin}
spring.datasource.password=${POSTGRES_PASSWORD:AVNS_0ZsQSxRo9a8l2H04hlV}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=false

# JWT
jwt.secret=${JWT_SECRET:mySuperSecretKeyForJWTthatIsAtLeast256BitsLongForHS256Algorithm2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File Upload
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Server
server.port=8080
